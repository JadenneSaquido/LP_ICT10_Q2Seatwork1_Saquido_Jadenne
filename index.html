<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PyScript Files -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Q2 Seatwork #1</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            padding-top: 50px;
            background-color: white;
            }

        .card {
            width: 320px;
            margin: 0 auto;
            padding: 25px;
            border-radius: 10px;
            background-color: rgb(255, 248, 249);
            box-shadow: 0px 4px 10px rgb(250, 218, 235);
            }

        input[type="text"] {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            font-size: 14px;
            border: 1px solid rgb(250, 218, 235);
            }

        input[type="button"] {
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            width: 95%;
            background-color: rgb(251, 173, 224);
            }

        input[type="button"]:hover {
            background-color: rgb(250, 218, 235);
            }

        #result {
            margin-top: 20px;
            font-weight: bold;
            font-size: 15px;
            color: rgb(251, 173, 224);
            }

        footer {
            margin-top: 30px;
            font-size: 13px;
            color: gray;
            }
    </style>
</head>
<body>

    <h1>Luminara Dance Club</h1>
    <p>Candidate Verification System</p>

    <div class="card">
        <input type="text" id="first_name" placeholder="Enter your First Name"> 
        <br>
        <input type="text" id="last_name" placeholder="Enter your Last Name"> 
        <br>
        <input type="button" py-click="candidate_checker" value="Enter"> 

        <div id="result"></div>
    </div>

    <footer>
        &copy; 2026 Luminara Dance Club &bull; Seatwork #1 &bull; Second Quarter
    </footer>

    <script type="py" src="main.py"></script>

</body>
</html>
